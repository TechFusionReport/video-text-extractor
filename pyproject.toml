[project]
name = "tfr-video-text-extractor"
version = "0.1.0"
description = "Caption-first video URL transcription service for TechFusion Report"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "yt-dlp[default,curl-cffi]>=2025.1.15",
  "faster-whisper>=1.1,<2",
  "rapidocr-onnxruntime>=1.4,<2",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_text_extractor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
